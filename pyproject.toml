[project]
name = "field-shift-rotation-twin"
version = "0.1.0"
description = "Compares crop rotations for a field against the observed climate record."
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "httpx",
    "pydantic",
    "uvicorn",
]

[dependency-groups]
dev = [
    "pip-licenses>=5.5.5",
    "pytest",
    "ruff",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
