# The six checks of docs/DEVELOPMENT_BLUEPRINT.md section 6.
# Owned by sub-lane L2a. A check whose folder does not exist yet is skipped
# with a notice, and switched on when the folder lands.

name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  # Check 1. Also runs the planted cases that show each check failing (ci/).
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.2"
      - name: Install
        run: uv sync --frozen
      - name: Run the tests
        run: uv run pytest
      - name: Lint the platform folders
        run: |
          folders=""
          for folder in api adapters ci; do
            if [ -d "$folder" ]; then folders="$folders $folder"; fi
          done
          uv run ruff check $folders
          uv run ruff format --check $folders

  # Check 2.
  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Is there a frontend?
        id: web
        run: |
          if [ -f web/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Frontend build skipped: web/package.json does not exist yet"
          fi
      - uses: actions/setup-node@v4
        if: steps.web.outputs.present == 'true'
        with:
          node-version: "22"
      - name: Build
        if: steps.web.outputs.present == 'true'
        working-directory: web
        run: |
          npm ci
          npm run build

  # Check 3. Agreed with the lead developer (#18): every folder under
  # contracts/ ships a test that loads each example into its model and
  # rejects each invalid variant.
  contract-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.2"
      - name: Install
        run: uv sync --frozen
      - name: Validate the contract examples
        run: uv run pytest contracts/

  # Check 4. Scans the whole history, not only the last commit.
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Scan for secrets
        run: >
          docker run --rm -v "$PWD:/repo:ro"
          ghcr.io/gitleaks/gitleaks:v8.21.2
          git /repo --redact --no-banner

  # Check 5. The list lives in the repository secret FORBIDDEN_NAMES, one
  # name per line. Without it (for example on a fork) the scan is skipped
  # with a notice.
  names-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Scan for forbidden names
        env:
          FORBIDDEN_NAMES: ${{ secrets.FORBIDDEN_NAMES }}
        run: python -m ci.names_scan

  # Check 6. Python dependencies; the frontend ones are added with web/.
  dependency-licences:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.2"
      - name: Install
        run: uv sync --frozen
      - name: Check the licences
        run: |
          set -o pipefail
          uv run pip-licenses --with-system --format=json | uv run python -m ci.licences
