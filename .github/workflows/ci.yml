# The six checks of docs/DEVELOPMENT_BLUEPRINT.md section 6, plus a seventh
# job that builds and starts the container image.
# Owned by sub-lane L2a. A check whose folder does not exist yet is skipped
# with a notice, and switched on when the folder lands.

name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  # Check 1. Also runs the planted cases that show each check failing (ci/).
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.2"
      - name: Install
        run: uv sync --frozen
      - name: Run the tests
        run: uv run pytest
      - name: Lint the platform folders
        run: |
          folders=""
          # economics/ and kinds_of_year/ come from l2/main-nico (#392, #386);
          # a folder that does not exist yet is skipped.
          for folder in api adapters ci economics kinds_of_year; do
            if [ -d "$folder" ]; then folders="$folders $folder"; fi
          done
          uv run ruff check $folders
          uv run ruff format --check $folders

  # Check 2.
  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Test and build
        working-directory: web
        run: |
          npm ci
          npm test
          npm run build

  # Check 3. Agreed with the lead developer (#18): every folder under
  # contracts/ ships a test that loads each example into its model and
  # rejects each invalid variant.
  contract-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.2"
      - name: Install
        run: uv sync --frozen
      - name: Validate the contract examples
        run: uv run pytest contracts/

  # Check 4. Scans the whole history, not only the last commit.
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Scan for secrets
        run: >
          docker run --rm -v "$PWD:/repo:ro"
          ghcr.io/gitleaks/gitleaks:v8.21.2
          git /repo --redact --no-banner

  # Check 5. The list lives in the repository secret FORBIDDEN_NAMES, one
  # name per line. Without it (for example on a fork) the scan is skipped
  # with a notice.
  names-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Scan for forbidden names
        env:
          FORBIDDEN_NAMES: ${{ secrets.FORBIDDEN_NAMES }}
        run: python -m ci.names_scan

  # Check 6. Python dependencies, then the frontend ones (read from
  # web/package-lock.json).
  dependency-licences:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.2"
      - name: Install
        run: uv sync --frozen
      - name: Check the licences
        run: |
          set -o pipefail
          uv run pip-licenses --with-system --format=json | uv run python -m ci.licences
      - name: Check the frontend licences
        run: uv run python -m ci.frontend_licences

  # Not one of the six checks: catches a broken Dockerfile on the pull
  # request instead of at deploy. Builds the image, starts it with no
  # configuration and waits for GET /health to answer 200. Nothing is pushed.
  image-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build the image
        run: docker build --tag field-shift-ci:throwaway .
      - name: Start the image and wait for /health
        run: |
          docker run --detach --name field-shift-ci --publish 8000:8000 field-shift-ci:throwaway
          for attempt in $(seq 1 30); do
            status=$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost:8000/health || true)
            if [ "$status" = "200" ]; then
              echo "GET /health answered 200 after $attempt attempt(s)"
              exit 0
            fi
            sleep 2
          done
          echo "::error::GET /health did not answer 200 within 60 seconds"
          docker logs field-shift-ci
          exit 1
      - name: Stop the container
        if: always()
        run: docker rm --force field-shift-ci || true
